# Adapted selectively from Walter 22e7fe2 for current phase4 application contracts.
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: gateway-tls
  namespace: vigiarural-phase4
spec:
  serverName: vigiarural.site
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vigiarural-phase4
  namespace: vigiarural-phase4
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: 'true'
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - vigiarural.site
    secretName: vigiarural-public-tls
  rules:
  - host: vigiarural.site
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: gateway
            port:
              number: 443
      - path: /health
        pathType: Prefix
        backend:
          service:
            name: gateway
            port:
              number: 443
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 80
