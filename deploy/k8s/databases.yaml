apiVersion: apps/v1
kind: Deployment
metadata:
  name: sensor-sqlserver
  namespace: vigiarural
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sensor-sqlserver
  template:
    metadata:
      labels:
        app: sensor-sqlserver
    spec:
      containers:
        - name: sensor-sqlserver
          image: mcr.microsoft.com/mssql/server:2022-latest
          env:
            - name: ACCEPT_EULA
              value: "Y"
            - name: MSSQL_PID
              value: "Developer"
            - name: MSSQL_SA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vigiarural-secrets
                  key: SENSOR_DB_PASSWORD
          ports:
            - containerPort: 1433
          volumeMounts:
            - name: sensor-sqlserver-data
              mountPath: /var/opt/mssql
      volumes:
        - name: sensor-sqlserver-data
          persistentVolumeClaim:
            claimName: sensor-sqlserver-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: sensor-sqlserver
  namespace: vigiarural
spec:
  selector:
    app: sensor-sqlserver
  ports:
    - port: 1433
      targetPort: 1433

