apiVersion: apps/v1
kind: Deployment
metadata:
  name: sensor-sqlserver
  namespace: vigiarural-phase4
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sensor-sqlserver
  template:
    metadata:
      labels:
        app: sensor-sqlserver
        tier: database
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      containers:
      - name: sensor-sqlserver
        image: mcr.microsoft.com/mssql/server@sha256:ba4c8329f48fb8f02e1416be6a930ebfd71268caee78aa985f3af4315e457c89
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 1433
        env:
        - name: ACCEPT_EULA
          value: Y
        - name: MSSQL_PID
          value: Express
        - name: MSSQL_SA_PASSWORD
          valueFrom:
            secretKeyRef:
              name: vigiarural-secrets
              key: SENSOR_SQL_PASSWORD
        resources:
          requests:
            cpu: 100m
            memory: 2Gi
          limits:
            cpu: '1'
            memory: 3Gi
        readinessProbe:
          exec:
            command: &id001
            - sh
            - -c
            - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$MSSQL_SA_PASSWORD"
              -C -Q "SELECT 1" -b -o /dev/null
          timeoutSeconds: 5
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: 1433
          periodSeconds: 20
        startupProbe:
          exec:
            command: *id001
          timeoutSeconds: 5
          periodSeconds: 10
          failureThreshold: 60
        volumeMounts:
        - name: data
          mountPath: /var/opt/mssql
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: sensor-sqlserver-pvc
  strategy:
    type: Recreate
---
apiVersion: v1
kind: Service
metadata:
  name: sensor-sqlserver
  namespace: vigiarural-phase4
spec:
  selector:
    app: sensor-sqlserver
  ports:
  - name: http
    port: 1433
    targetPort: 1433
  type: ClusterIP
