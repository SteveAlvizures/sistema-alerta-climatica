apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-postgres
  namespace: vigiarural
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-postgres
  template:
    metadata:
      labels:
        app: auth-postgres
    spec:
      containers:
        - name: auth-postgres
          image: postgres:17-alpine
          env:
            - name: POSTGRES_DB
              value: "auth_db"
            - name: POSTGRES_USER
              value: "auth_user"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vigiarural-secrets
                  key: AUTH_DB_PASSWORD
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: auth-postgres-data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U auth_user -d auth_db
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U auth_user -d auth_db
            initialDelaySeconds: 20
            periodSeconds: 20
      volumes:
        - name: auth-postgres-data
          persistentVolumeClaim:
            claimName: auth-postgres-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: auth-postgres
  namespace: vigiarural
spec:
  selector:
    app: auth-postgres
  ports:
    - port: 5432
      targetPort: 5432

