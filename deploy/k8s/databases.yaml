apiVersion: apps/v1
kind: Deployment
metadata:
  name: report-mongodb
  namespace: vigiarural-phase4
spec:
  replicas: 1
  selector:
    matchLabels:
      app: report-mongodb
  template:
    metadata:
      labels:
        app: report-mongodb
        tier: database
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      containers:
      - name: report-mongodb
        image: mongo@sha256:4a4ab5d4834207389e0d7270fac988e21ffedccecba77991a552f755df229907
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 27017
        env:
        - name: MONGO_INITDB_ROOT_USERNAME
          value: report_root
        - name: MONGO_INITDB_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: vigiarural-secrets
              key: REPORT_MONGO_ROOT_PASSWORD
        - name: REPORT_MONGO_DATABASE
          value: climate_reports
        - name: REPORT_MONGO_USER
          value: report_app
        - name: REPORT_MONGO_PASSWORD
          valueFrom:
            secretKeyRef:
              name: vigiarural-secrets
              key: REPORT_MONGO_PASSWORD
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: '1'
            memory: 768Mi
        readinessProbe:
          exec:
            command: &id001
            - mongosh
            - --quiet
            - --eval
            - 'quit(db.adminCommand(''ping'').ok ? 0 : 1)'
          timeoutSeconds: 5
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: 27017
          periodSeconds: 20
        startupProbe:
          exec:
            command: *id001
          timeoutSeconds: 5
          periodSeconds: 10
          failureThreshold: 60
        volumeMounts:
        - name: data
          mountPath: /data/db
        - name: init
          mountPath: /docker-entrypoint-initdb.d
          readOnly: true
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: report-mongodb-pvc
      - name: init
        configMap:
          name: mongo-init
  strategy:
    type: Recreate
---
apiVersion: v1
kind: Service
metadata:
  name: report-mongodb
  namespace: vigiarural-phase4
spec:
  selector:
    app: report-mongodb
  ports:
  - name: http
    port: 27017
    targetPort: 27017
  type: ClusterIP
---
