# Adapted selectively from Walter 22e7fe2 for current phase4 application contracts.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-postgres
  namespace: vigiarural-phase4
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-postgres
  template:
    metadata:
      labels:
        app: auth-postgres
        tier: database
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      containers:
      - name: auth-postgres
        image: postgres@sha256:1bcc18d81671b02906296aad470ec9778a6b71016ce953092024b680bad007b0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_DB
          value: climate_auth
        - name: POSTGRES_USER
          value: auth_app
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: vigiarural-secrets
              key: AUTH_DATABASE_PASSWORD
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: '1'
            memory: 768Mi
        readinessProbe:
          exec:
            command: &id001
            - sh
            - -c
            - pg_isready -U auth_app -d climate_auth
          timeoutSeconds: 5
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: 5432
          periodSeconds: 20
        startupProbe:
          exec:
            command: *id001
          timeoutSeconds: 5
          periodSeconds: 10
          failureThreshold: 60
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: auth-postgres-pvc
  strategy:
    type: Recreate
---
apiVersion: v1
kind: Service
metadata:
  name: auth-postgres
  namespace: vigiarural-phase4
spec:
  selector:
    app: auth-postgres
  ports:
  - name: http
    port: 5432
    targetPort: 5432
  type: ClusterIP
---
