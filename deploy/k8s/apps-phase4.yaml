apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: vigiarural-phase4
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
        tier: application
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      containers:
      - name: gateway
        image: vigiarural/gateway:REPLACE_WITH_COMMIT
        imagePullPolicy: IfNotPresent
        ports: []
        env:
        - name: JWT_ISSUER
          valueFrom:
            configMapKeyRef:
              name: vigiarural-config
              key: JWT_ISSUER
        - name: JWT_AUDIENCE
          valueFrom:
            configMapKeyRef:
              name: vigiarural-config
              key: JWT_AUDIENCE
        - name: JWT_KEY
          valueFrom:
            secretKeyRef:
              name: vigiarural-secrets
              key: JWT_KEY
        - name: AUTH_INTERNAL_KEY
          valueFrom:
            secretKeyRef:
              name: vigiarural-secrets
              key: AUTH_INTERNAL_KEY
        - name: AUTH_SERVICE_URL
          value: http://auth-service:3000
        - name: ASPNETCORE_ENVIRONMENT
          value: Production
        - name: ASPNETCORE_URLS
          value: http://127.0.0.1:8080
        - name: Gateway__TrustedProxyAddresses__0
          value: 127.0.0.1
        - name: Gateway__AllowedOrigins__0
          value: https://vigiarural.site
        - name: ReverseProxy__Clusters__monolith__Destinations__backend__Address
          value: http://backend:8080/
        - name: ReverseProxy__Clusters__auth__Destinations__auth-service__Address
          value: http://auth-service:3000/
        - name: ReverseProxy__Clusters__reports__Destinations__report-service__Address
          value: http://report-service:8000/
        - name: ReverseProxy__Clusters__community__Destinations__primary__Address
          value: http://community-service:8080/
        - name: ReverseProxy__Clusters__sensor__Destinations__primary__Address
          value: http://sensor-service:8080/
        - name: ReverseProxy__Clusters__alert__Destinations__primary__Address
          value: http://alert-service:3003/
        - name: ReverseProxy__Clusters__audit__Destinations__primary__Address
          value: http://audit-service:8000/
        - name: ReverseProxy__Routes__communities__ClusterId
          value: community
        - name: ReverseProxy__Routes__sensors__ClusterId
          value: sensor
        - name: ReverseProxy__Routes__sensor-readings__ClusterId
          value: sensor
        - name: ReverseProxy__Routes__community-sensors__ClusterId
          value: sensor
        - name: ReverseProxy__Routes__alerts__ClusterId
          value: alert
        - name: ReverseProxy__Routes__alert-rules__ClusterId
          value: alert
        - name: ReverseProxy__Routes__community-alerts__ClusterId
          value: alert
        - name: ReverseProxy__Routes__events__ClusterId
          value: alert
        - name: ReverseProxy__Routes__audit-actions__ClusterId
          value: audit
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: '1'
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
        readinessProbe:
          exec:
            command:
            - curl
            - --fail
            - --silent
            - --max-time
            - '4'
            - http://127.0.0.1:8080/health/ready
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        livenessProbe:
          exec:
            command:
            - curl
            - --fail
            - --silent
            - --max-time
            - '4'
            - http://127.0.0.1:8080/health/live
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        startupProbe:
          exec:
            command:
            - curl
            - --fail
            - --silent
            - --max-time
            - '4'
            - http://127.0.0.1:8080/health/live
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 36
      - name: tls-proxy
        image: nginx@sha256:785835ea65db4bba6f021acc0f3be91b0fef76a53fe41f8588c6698d2aed0606
        imagePullPolicy: IfNotPresent
        ports:
        - name: https
          containerPort: 8443
        - name: probe
          containerPort: 8081
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 128Mi
        volumeMounts:
        - name: gateway-nginx
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: default.conf
          readOnly: true
        - name: tls
          mountPath: /etc/nginx/tls
          readOnly: true
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8081
          periodSeconds: 10
