apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: vigiarural-phase4
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
        tier: application
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      containers:
      - name: auth-service
        image: vigiarural/auth-service:REPLACE_WITH_COMMIT
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
        env:
        - name: JWT_ISSUER
          valueFrom:
            configMapKeyRef:
              name: vigiarural-config
              key: JWT_ISSUER
        - name: JWT_AUDIENCE
          valueFrom:
            configMapKeyRef:
              name: vigiarural-config
              key: JWT_AUDIENCE
        - name: JWT_KEY
          valueFrom:
            secretKeyRef:
              name: vigiarural-secrets
              key: JWT_KEY
        - name: AUTH_INTERNAL_KEY
          valueFrom:
            secretKeyRef:
              name: vigiarural-secrets
              key: AUTH_INTERNAL_KEY
        - name: AUTH_SERVICE_URL
          value: http://auth-service:3000
        - name: JWT_EXPIRATION_MINUTES
          valueFrom:
            configMapKeyRef:
              name: vigiarural-config
              key: JWT_EXPIRATION_MINUTES
        - name: OAUTH_ENV
          valueFrom:
            configMapKeyRef:
              name: vigiarural-config
              key: OAUTH_ENV
        - name: OAUTH_PUBLIC_ORIGIN
          valueFrom:
            configMapKeyRef:
              name: vigiarural-config
              key: OAUTH_PUBLIC_ORIGIN
        - name: AUTH_DATABASE_HOST
          valueFrom:
            configMapKeyRef:
              name: vigiarural-config
              key: AUTH_DATABASE_HOST
        - name: AUTH_DATABASE_PORT
          valueFrom:
            configMapKeyRef:
              name: vigiarural-config
              key: AUTH_DATABASE_PORT
        - name: AUTH_DATABASE_NAME
          valueFrom:
            configMapKeyRef:
              name: vigiarural-config
              key: AUTH_DATABASE_NAME
        - name: AUTH_DATABASE_USER
          valueFrom:
            configMapKeyRef:
              name: vigiarural-config
              key: AUTH_DATABASE_USER
        - name: AUTH_DATABASE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: vigiarural-secrets
              key: AUTH_DATABASE_PASSWORD
        - name: AUTH_AUDIT_URL
          value: http://audit-service:8000/internal/auth-events
        - name: PORT
          value: '3000'
        - name: GOOGLE_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: vigiarural-secrets
              key: GOOGLE_CLIENT_ID
        - name: GOOGLE_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: vigiarural-secrets
              key: GOOGLE_CLIENT_SECRET
        - name: GITHUB_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: vigiarural-secrets
              key: GITHUB_CLIENT_ID
        - name: GITHUB_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: vigiarural-secrets
              key: GITHUB_CLIENT_SECRET
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: '1'
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 3000
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /health/live
            port: 3000
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /health/live
            port: 3000
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 36
---
