apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: vigiarural-phase4
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
        tier: application
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      containers:
      - name: frontend
        image: vigiarural/frontend:REPLACE_WITH_COMMIT
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: '1'
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
            add:
            - CHOWN
            - SETUID
            - SETGID
            - NET_BIND_SERVICE
          seccompProfile:
            type: RuntimeDefault
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 80
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /health/live
            port: 80
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /health/live
            port: 80
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 36
        volumeMounts:
        - name: frontend-nginx
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: default.conf
          readOnly: true
      volumes:
      - name: frontend-nginx
        configMap:
          name: frontend-nginx
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: vigiarural-phase4
spec:
  selector:
    app: frontend
  ports:
  - name: http
    port: 80
    targetPort: 80
  type: ClusterIP
