# Candidate for the existing host Nginx, NOT automatically installed.
# Replace TRAEFIK_CLUSTER_IP with the observed kube-system/traefik Service ClusterIP.
# Back up the active vhost, reconcile existing Ingress host rules, then run nginx -t.
server {
    listen 80;
    server_name vigiarural.site www.vigiarural.site;
    return 301 https://vigiarural.site$request_uri;
}
server {
    listen 443 ssl;
    server_name vigiarural.site www.vigiarural.site;
    ssl_certificate /etc/letsencrypt/live/vigiarural.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vigiarural.site/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    access_log off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    location / {
        proxy_pass https://TRAEFIK_CLUSTER_IP:443;
        proxy_ssl_server_name on;
        proxy_ssl_name vigiarural.site;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_set_header Host vigiarural.site;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 40s;
    }
}
