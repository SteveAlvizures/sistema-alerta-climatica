# Adapted selectively from Walter 22e7fe2 for current phase4 application contracts.
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: vigiarural-phase4
spec:
  selector:
    app: auth-service
  ports:
  - name: http
    port: 3000
    targetPort: 3000
  type: ClusterIP
---
