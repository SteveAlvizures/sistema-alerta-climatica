apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: vigiarural
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: auth-service
          image: vigiarural/auth-service:phase3
          ports:
            - containerPort: 3001
          env:
            - name: PORT
              value: "3001"
            - name: AUTH_DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: vigiarural-config
                  key: AUTH_DB_HOST
            - name: AUTH_DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: vigiarural-config
                  key: AUTH_DB_PORT
            - name: AUTH_DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: vigiarural-config
                  key: AUTH_DB_NAME
            - name: AUTH_DB_USER
              valueFrom:
                configMapKeyRef:
                  name: vigiarural-config
                  key: AUTH_DB_USER
            - name: AUTH_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vigiarural-secrets
                  key: AUTH_DB_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: vigiarural-secrets
                  key: JWT_SECRET
            - name: JWT_ISSUER
              valueFrom:
                configMapKeyRef:
                  name: vigiarural-config
                  key: JWT_ISSUER
            - name: JWT_AUDIENCE
              valueFrom:
                configMapKeyRef:
                  name: vigiarural-config
                  key: JWT_AUDIENCE
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 20
            periodSeconds: 20

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: community-service
  namespace: vigiarural
spec:
  replicas: 1
  selector:
    matchLabels:
      app: community-service
  template:
    metadata:
      labels:
        app: community-service
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: community-service
          image: vigiarural/community-service:phase3
          ports:
            - containerPort: 3002
          env:
            - name: ASPNETCORE_URLS
              value: "http://+:3002"
            - name: COMMUNITY_DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: vigiarural-config
                  key: COMMUNITY_DB_HOST
            - name: COMMUNITY_DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: vigiarural-config
                  key: COMMUNITY_DB_PORT
            - name: COMMUNITY_DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: vigiarural-config
                  key: COMMUNITY_DB_NAME
            - name: COMMUNITY_DB_USER
              valueFrom:
                configMapKeyRef:
                  name: vigiarural-config
                  key: COMMUNITY_DB_USER
            - name: COMMUNITY_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vigiarural-secrets
                  key: COMMUNITY_DB_PASSWORD
            - name: ConnectionStrings__CommunityDatabase
              value: "Host=$(COMMUNITY_DB_HOST);Port=$(COMMUNITY_DB_PORT);Database=$(COMMUNITY_DB_NAME);Username=$(COMMUNITY_DB_USER);Password=$(COMMUNITY_DB_PASSWORD)"
            - name: Jwt__Secret
              valueFrom:
                secretKeyRef:
                  name: vigiarural-secrets
                  key: JWT_SECRET
            - name: Jwt__Issuer
              valueFrom:
                configMapKeyRef:
                  name: vigiarural-config
                  key: JWT_ISSUER
            - name: Jwt__Audience
              valueFrom:
                configMapKeyRef:
                  name: vigiarural-config
                  key: JWT_AUDIENCE
          readinessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 20
            periodSeconds: 20

