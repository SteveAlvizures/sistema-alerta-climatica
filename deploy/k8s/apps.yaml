apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: vigiarural
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: gateway
          image: vigiarural/gateway:phase3
          ports:
            - containerPort: 8080
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: vigiarural-secrets
                  key: JWT_SECRET
            - name: JWT_ISSUER
              valueFrom:
                configMapKeyRef:
                  name: vigiarural-config
                  key: JWT_ISSUER
            - name: JWT_AUDIENCE
              valueFrom:
                configMapKeyRef:
                  name: vigiarural-config
                  key: JWT_AUDIENCE
            - name: ReverseProxy__Clusters__auth__Destinations__auth-service__Address
              value: "http://auth-service:3001/"
            - name: ReverseProxy__Clusters__community__Destinations__community-service__Address
              value: "http://community-service:3002/"
            - name: ReverseProxy__Clusters__alert__Destinations__alert-service__Address
              value: "http://alert-service:3003/"
            - name: ReverseProxy__Clusters__sensor__Destinations__sensor-service__Address
              value: "http://sensor-service:3004/"
            - name: ReverseProxy__Clusters__report__Destinations__report-service__Address
              value: "http://report-service:3005/"
            - name: ReverseProxy__Clusters__audit__Destinations__audit-service__Address
              value: "http://audit-service:3006/"
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 25
            periodSeconds: 20
