# Optional future replacement for the frontend Nginx configuration. NOT activated by Compose.
# Nginx itself terminates TLS. Mount real certificates read-only before using this file.
# Gateway:TrustedProxyAddresses must list ONLY this Nginx peer IP on a private network.
# Do not publish Gateway/Sensor directly. Never substitute $http_x_forwarded_proto for $scheme.
server {
    listen 80;
    server_name _;
    return 400;
}

server {
    listen 443 ssl;
    server_name _;
    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    location = /index.html { add_header Cache-Control "no-store" always; }
    location / { try_files $uri $uri/ /index.html; }
    location ^~ /internal/ { return 404; }

    location ~ ^/(api(?:/|$)|health(?:/|$)) {
        proxy_pass http://gateway:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 35s;
    }
}
