name: climate-alert-auth-tests
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: auth_integration_test
      POSTGRES_USER: auth_test
      POSTGRES_PASSWORD: ${AUTH_TEST_PASSWORD:?AUTH_TEST_PASSWORD is required}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - auth-test-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U auth_test -d auth_integration_test']
      interval: 2s
      timeout: 2s
      retries: 30
volumes:
  auth-test-data:
