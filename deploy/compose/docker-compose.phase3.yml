name: climate-alert-phase3
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
services:
  report-mongodb:
    logging: *default-logging
    image: mongo:8.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: report_root
      MONGO_INITDB_ROOT_PASSWORD: ${REPORT_MONGO_ROOT_PASSWORD:?REPORT_MONGO_ROOT_PASSWORD is required}
      REPORT_MONGO_DATABASE: ${REPORT_MONGO_DATABASE:-climate_reports}
      REPORT_MONGO_USER: ${REPORT_MONGO_USER:-report_app}
      REPORT_MONGO_PASSWORD: ${REPORT_MONGO_PASSWORD:?REPORT_MONGO_PASSWORD is required}
    volumes:
      - report-mongodb-data:/data/db
      - ../mongo/init-report.js:/docker-entrypoint-initdb.d/init-report.js:ro
    networks: [report-persistence]
    healthcheck:
      test: [CMD, mongosh, --quiet, --eval, "quit(db.adminCommand('ping').ok ? 0 : 1)"]
      interval: 5s
      timeout: 4s
      retries: 15
    restart: unless-stopped

  report-service:
    logging: *default-logging
    build:
      context: ../../services/report-service
      target: runtime
    environment:
      JWT_KEY: ${JWT_KEY:?JWT_KEY is required}
      JWT_ISSUER: ${JWT_ISSUER:-climate-alert-api}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-climate-alert-client}
      AUTH_INTERNAL_KEY: ${AUTH_INTERNAL_KEY:?AUTH_INTERNAL_KEY is required}
      AUTH_SERVICE_URL: http://auth-service:3000
      REPORT_MONGO_HOST: report-mongodb
      REPORT_MONGO_DATABASE: ${REPORT_MONGO_DATABASE:-climate_reports}
      REPORT_MONGO_USER: ${REPORT_MONGO_USER:-report_app}
      REPORT_MONGO_PASSWORD: ${REPORT_MONGO_PASSWORD:?REPORT_MONGO_PASSWORD is required}
      COMMUNITY_API_URL: ${REPORT_COMMUNITY_API_URL:-http://backend:8080}
      SENSOR_API_URL: ${REPORT_SENSOR_API_URL:-http://backend:8080}
      READING_API_URL: ${REPORT_READING_API_URL:-http://backend:8080}
      ALERT_API_URL: ${REPORT_ALERT_API_URL:-http://backend:8080}
      EVENT_API_URL: ${REPORT_EVENT_API_URL:-http://backend:8080}
    depends_on:
      report-mongodb:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    networks: [upstream, report-persistence]
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  auth-postgres:
    logging: *default-logging
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${AUTH_DATABASE_NAME:-climate_auth}
      POSTGRES_USER: ${AUTH_DATABASE_USER:-auth_app}
      POSTGRES_PASSWORD: ${AUTH_DATABASE_PASSWORD:?AUTH_DATABASE_PASSWORD is required}
    volumes:
      - auth-postgres-data:/var/lib/postgresql/data
    networks: [auth-persistence]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  auth-service:
    logging: *default-logging
    build:
      context: ../../services/auth-service
      dockerfile: Dockerfile
    environment:
      PORT: "3000"
      AUTH_DATABASE_HOST: auth-postgres
      AUTH_DATABASE_PORT: "5432"
      AUTH_DATABASE_NAME: ${AUTH_DATABASE_NAME:-climate_auth}
      AUTH_DATABASE_USER: ${AUTH_DATABASE_USER:-auth_app}
      AUTH_DATABASE_PASSWORD: ${AUTH_DATABASE_PASSWORD:?AUTH_DATABASE_PASSWORD is required}
      JWT_KEY: ${JWT_KEY:?JWT_KEY is required}
      JWT_ISSUER: ${JWT_ISSUER:-climate-alert-api}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-climate-alert-client}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-60}
      AUTH_INTERNAL_KEY: ${AUTH_INTERNAL_KEY:?AUTH_INTERNAL_KEY is required}
      AUTH_AUDIT_URL: http://backend:8080/internal/auth-events
    depends_on:
      auth-postgres:
        condition: service_healthy
    networks: [upstream, auth-persistence]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 4s
      retries: 12
    restart: unless-stopped

  sqlserver:
    logging: *default-logging
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: ${SQLSERVER_EDITION:-Developer}
      MSSQL_SA_PASSWORD: ${SQLSERVER_PASSWORD:?SQLSERVER_PASSWORD is required}
    volumes:
      - climate-alert-sqlserver-data:/var/opt/mssql
    networks: [persistence]
    healthcheck:
      test: [CMD-SHELL, '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" -b -o /dev/null']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  backend:
    logging: *default-logging
    build:
      context: ../../backend
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      SQLSERVER_CONNECTION_STRING: ${SQLSERVER_CONNECTION_STRING:?SQLSERVER_CONNECTION_STRING is required}
      JWT_KEY: ${JWT_KEY:?JWT_KEY is required}
      JWT_ISSUER: ${JWT_ISSUER:-climate-alert-api}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-climate-alert-client}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-60}
      Database__ApplyMigrationsOnStartup: "false"
      DEMO_DATA_SEED_ENABLED: "false"
      SIMULATED_READING_INTERVAL_SECONDS: ${SIMULATED_READING_INTERVAL_SECONDS:-60}
      AUTH_SERVICE_URL: http://auth-service:3000/
      AUTH_INTERNAL_KEY: ${AUTH_INTERNAL_KEY:?AUTH_INTERNAL_KEY is required}
    depends_on:
      sqlserver:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    networks: [upstream, persistence]
    healthcheck:
      test: [CMD, curl, --fail, --silent, --max-time, "4", http://localhost:8080/health]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  gateway:
    logging: *default-logging
    build:
      context: ../../gateway
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      JWT_KEY: ${JWT_KEY:?JWT_KEY is required}
      JWT_ISSUER: ${JWT_ISSUER:-climate-alert-api}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-climate-alert-client}
      ReverseProxy__Clusters__monolith__Destinations__backend__Address: http://backend:8080/
      ReverseProxy__Clusters__auth__Destinations__auth-service__Address: http://auth-service:3000/
      ReverseProxy__Clusters__reports__Destinations__report-service__Address: http://report-service:8000/
      Gateway__AllowedOrigins__0: ${FRONTEND_ORIGIN:-http://localhost:8082}
    depends_on:
      report-service:
        condition: service_healthy
      backend:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    networks: [edge, upstream]
    healthcheck:
      test: [CMD, curl, --fail, --silent, --max-time, "5", http://localhost:8080/health/ready]
      interval: 10s
      timeout: 6s
      retries: 6
      start_period: 10s
    restart: unless-stopped

  frontend:
    logging: *default-logging
    build:
      context: ../../frontend/angular-app
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_BIND:-127.0.0.1}:${FRONTEND_PORT:-8082}:80"
    volumes:
      - ../nginx/nginx.phase3.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      gateway:
        condition: service_healthy
    networks: [edge]
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1/]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

volumes:
  report-mongodb-data:
    name: ${REPORT_MONGO_VOLUME:-climate-alert-report-mongodb-data}
  auth-postgres-data:
    name: ${AUTH_POSTGRES_VOLUME:-climate-alert-auth-postgres-data}
  climate-alert-sqlserver-data:
    external: true
    name: ${PHASE3_SQL_VOLUME:-climate-alert-sqlserver-data}

networks:
  report-persistence:
    internal: true
  auth-persistence:
    internal: true
  edge:
  upstream:
    internal: true
  persistence:
    internal: true
