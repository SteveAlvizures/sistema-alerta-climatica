<section class="login-page">
  <div class="login-card">
    <div class="login-card__brand">
      <span class="login-card__mark" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M5 19c6 0 11-5 14-14 0 8-2 14-9 14H5Zm2-3c3-4 6-6 10-8" /></svg>
      </span>
      <div>
        <span class="login-card__name">Vigía Rural</span>
        <p>Sistema de Monitoreo y Alerta Temprana para Riesgos Climáticos</p>
      </div>
    </div>

    <form class="login-form" (ngSubmit)="submit()">
      <label class="form-field">
        <span>Correo electrónico</span>
        <input
          type="email"
          name="email"
          [(ngModel)]="email"
          required
          autocomplete="username"
          placeholder="tu.correo@ejemplo.com"
        />
      </label>

      <label class="form-field">
        <span>Contraseña</span>
        <input
          type="password"
          name="password"
          [(ngModel)]="password"
          required
          autocomplete="current-password"
          placeholder="••••••••"
        />
      </label>

      @if (errorMessage(); as message) {
        <p class="login-form__error" role="alert">{{ message }}</p>
      }

      <button class="primary-button" type="submit" [disabled]="submitting()">
        {{ submitting() ? 'Ingresando...' : 'Iniciar sesión' }}
      </button>
    </form>
  </div>
</section>
