<article class="indicator-card">
  <div class="indicator-card__heading">
    <span>{{ indicator().name }}</span>
    <span class="indicator-card__icon" aria-hidden="true">
      @switch (indicator().key) {
        @case ('temperature') { <svg viewBox="0 0 24 24"><path d="M10 14.8V5a2 2 0 1 1 4 0v9.8a4 4 0 1 1-4 0Z" /><path d="M12 9v7" /></svg> }
        @case ('humidity') { <svg viewBox="0 0 24 24"><path d="M12 3S6.5 9.2 6.5 14a5.5 5.5 0 0 0 11 0C17.5 9.2 12 3 12 3Z" /></svg> }
        @case ('wind') { <svg viewBox="0 0 24 24"><path d="M3 8h11a3 3 0 1 0-3-3M3 12h16a2 2 0 1 1-2 2M3 16h8" /></svg> }
        @case ('rain') { <svg viewBox="0 0 24 24"><path d="M7 15a4 4 0 0 1 .6-8A5 5 0 0 1 17 9a3 3 0 0 1 0 6H7Z" /><path d="m9 18-1 2m5-2-1 2m5-2-1 2" /></svg> }
        @default { <svg viewBox="0 0 24 24"><path d="M3 14c3-2 5 2 8 0s5 2 10 0M3 18c3-2 5 2 8 0s5 2 10 0M6 10V5h12v5" /></svg> }
      }
    </span>
  </div>
  <strong>{{ indicator().value }}</strong>
  <p>{{ indicator().detail }}</p>
</article>
