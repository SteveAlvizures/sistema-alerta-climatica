<header class="app-header">
  <div class="app-header__brand">
    <span class="app-header__mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 19c6 0 11-5 14-14 0 8-2 14-9 14H5Zm2-3c3-4 6-6 10-8" /></svg></span>
    <div><span class="app-header__name">Vigía Rural</span><p>Sistema Web de Monitoreo y Alerta Temprana para Riesgos Climáticos</p></div>
  </div>
  <div class="app-header__status" aria-label="Estado de actualización del sistema">
    <span class="app-header__simulation">Modo de simulación</span>
    <span class="app-header__time">Actualizado {{ formatTime(climate.dashboard().lastUpdated) }}</span>
    <app-status-badge label="Monitoreo activo" tone="green" />
    <button class="theme-toggle" type="button" [attr.aria-label]="themeService.theme() === 'light' ? 'Activar modo oscuro' : 'Activar modo claro'" [attr.title]="themeService.theme() === 'light' ? 'Activar modo oscuro' : 'Activar modo claro'" (click)="themeService.toggle()">
      @if (themeService.theme() === 'light') { <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.4 15.4A8 8 0 0 1 8.6 3.6 8.5 8.5 0 1 0 20.4 15.4Z" /></svg> }
      @else { <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4" /><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" /></svg> }
    </button>
  </div>
</header>
