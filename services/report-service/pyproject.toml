[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "vigia-report-service"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi==0.135.1", "uvicorn==0.41.0", "httpx==0.28.1", "pymongo==4.16.0", "PyJWT==2.12.1", "jinja2==3.1.6", "weasyprint==68.1", "pydantic-settings==2.13.1"]

[project.optional-dependencies]
test = ["pytest==9.0.2", "pypdf==6.8.0", "ruff==0.15.6"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
