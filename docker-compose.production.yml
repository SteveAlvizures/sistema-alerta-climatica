# Standalone: use -f docker-compose.production.yml ONLY. Host TLS proxy required.
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: climate-alert-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: ${SQLSERVER_EDITION:-Express}
      MSSQL_SA_PASSWORD: ${SQLSERVER_PASSWORD:?SQLSERVER_PASSWORD is required}
    volumes:
      - climate-alert-sqlserver-data:/var/opt/mssql
    networks:
      - climate-alert-network
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" -b -o /dev/null
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: climate-alert-api
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      TRUSTED_PROXY_NETWORK: 172.30.42.0/24
      SQLSERVER_CONNECTION_STRING: ${SQLSERVER_CONNECTION_STRING:?SQLSERVER_CONNECTION_STRING is required}
      JWT_KEY: ${JWT_KEY:?JWT_KEY is required}
      JWT_ISSUER: ${JWT_ISSUER:-climate-alert-api}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-climate-alert-client}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-60}
      INITIAL_ADMIN_USERNAME: ${INITIAL_ADMIN_USERNAME:?INITIAL_ADMIN_USERNAME is required}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:?INITIAL_ADMIN_PASSWORD is required}
      DEMO_DATA_SEED_ENABLED: "false"
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - climate-alert-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend/angular-app
      dockerfile: Dockerfile
    container_name: climate-alert-frontend
    ports:
      - "127.0.0.1:8081:80"
    volumes:
      - ./frontend/angular-app/nginx.production.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - climate-alert-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

volumes:
  climate-alert-sqlserver-data:
    name: climate-alert-sqlserver-data

networks:
  climate-alert-network:
    name: climate-alert-network
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.42.0/24
