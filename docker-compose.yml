services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: climate-alert-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${SQLSERVER_PASSWORD}
    ports:
      - "${SQLSERVER_PORT}:1433"
    volumes:
      - climate-alert-sqlserver-data:/var/opt/mssql
    networks:
      - climate-alert-network
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" -b -o /dev/null
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: climate-alert-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      SQLSERVER_CONNECTION_STRING: ${SQLSERVER_CONNECTION_STRING}
    ports:
      - "8080:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - climate-alert-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend/angular-app
      dockerfile: Dockerfile
    container_name: climate-alert-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - climate-alert-network
    restart: unless-stopped

volumes:
  climate-alert-sqlserver-data:
    name: climate-alert-sqlserver-data

networks:
  climate-alert-network:
    name: climate-alert-network
    driver: bridge
