services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: climate-alert-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${SQLSERVER_PASSWORD}
    ports:
      - "${SQLSERVER_PORT}:1433"
    volumes:
      - climate-alert-sqlserver-data:/var/opt/mssql
    networks:
      - climate-alert-network
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" -b -o /dev/null
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

volumes:
  climate-alert-sqlserver-data:
    name: climate-alert-sqlserver-data

networks:
  climate-alert-network:
    name: climate-alert-network
    driver: bridge